<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logviewer - {{FILE_NAME}}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="{{WRAP_CLASS}}">
    <div class="app">
      <header class="header-bar px-2 py-1 border-bottom">
        <div class="d-flex flex-wrap align-items-center gap-3">
          <select id="file-select" class="form-select form-select-sm file-select"></select>
          <div class="text-muted small" id="file-meta">Loading metadata...</div>
          <div class="ms-auto d-flex align-items-center gap-3">
            <div class="d-flex align-items-center gap-2">
              <label class="small text-muted" for="charset-select">Charset</label>
              <select
                id="charset-select"
                class="form-select form-select-sm charset-select"
              ></select>
            </div>
            <div class="form-check form-switch m-0">
              <input class="form-check-input" type="checkbox" id="line-numbers-toggle" />
              <label class="form-check-label small text-muted" for="line-numbers-toggle">Lines</label>
            </div>
            <div class="form-check form-switch m-0">
              <input class="form-check-input" type="checkbox" id="wrap-toggle" />
              <label class="form-check-label small text-muted" for="wrap-toggle">Wrap</label>
            </div>
            <div class="text-muted small" id="range-meta"></div>
          </div>
        </div>
      </header>
      <main class="viewer-layout">
        <aside class="sidebar">
          <div class="sidebar-header">
            <div class="fw-semibold small">Categories</div>
            <button id="add-category" class="btn btn-sm btn-outline-secondary">Add</button>
          </div>
          <div id="category-list" class="category-list"></div>
          <div id="category-empty" class="category-empty text-muted small">
            Add a category to mark or solo matching lines.
          </div>
        </aside>
        <div class="viewer">
          <div id="scroll-area" class="scroll-area">
            <div id="spacer" class="spacer"></div>
            <div id="log-row" class="log-row">
              <pre id="line-numbers" class="line-numbers"></pre>
              <div id="log-content" class="log-content"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="/js/client.js"></script>
  </body>
</html>
