<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logviewer - {{FILE_NAME}}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="{{WRAP_CLASS}}">
    <div class="app">
      <header class="header-bar px-2 py-1 border-bottom">
        <div class="d-flex flex-wrap align-items-center gap-3">
          <div class="fw-semibold text-truncate">{{FILE_NAME}}</div>
          <div class="text-muted small" id="file-meta">Loading metadata...</div>
          <div class="ms-auto text-muted small" id="range-meta"></div>
        </div>
      </header>
      <main class="viewer">
        <div id="scroll-area" class="scroll-area">
          <div id="spacer" class="spacer"></div>
          <pre id="log-content" class="log-content"></pre>
        </div>
      </main>
    </div>
    <script src="/js/client.js"></script>
  </body>
</html>
